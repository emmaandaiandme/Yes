<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Host · Upload</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb;--accent:#635bff;--muted:#667085;--line:#dfe5ef}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(circle at 82% 0,#e8e3ff,transparent 34rem),#f5f7fb}.shell{width:min(680px,100%);margin:8vh auto}.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;font-weight:800}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#635bff,#159f8b);color:#fff}.card{padding:clamp(26px,6vw,52px);border:1px solid var(--line);border-radius:30px;background:#fffffff2;box-shadow:0 24px 80px #52607d1c}h1{margin:0 0 12px;font-size:clamp(32px,6vw,52px);line-height:1;letter-spacing:-.06em}p{margin:0;color:var(--muted);line-height:1.6}.auth{margin:24px 0}.auth label{display:block;margin:18px 0 8px;font-size:13px;font-weight:800}.auth input{display:block;width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;letter-spacing:.25em;text-transform:uppercase}.auth button{margin-top:12px;padding:13px 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:800}.drop{display:flex;align-items:center;gap:16px;margin:30px 0 14px;padding:22px;border:2px dashed #c7cedb;border-radius:18px;cursor:pointer}.drop-icon{display:grid;place-items:center;width:50px;height:50px;border-radius:15px;background:#eeeaff;color:var(--accent);font-size:24px}input[type=file]{display:none}.limits{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.limits span{padding:5px 9px;border-radius:99px;background:#f3f1ff;color:#5a52d7;font-size:11px;font-weight:700}.meter{height:8px;margin-top:22px;overflow:hidden;border-radius:99px;background:#eceef4}.meter span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),#159f8b);transition:width .2s}.status{min-height:26px;margin-top:16px;font-size:14px;font-weight:600;word-break:break-word}.success{color:#16856f}.error{color:#c0392b}.result{display:inline-block;margin-top:8px;color:var(--accent);font-weight:700}.history{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.history h2{margin:0 0 10px;font-size:14px}.history a{display:block;margin:8px 0;color:var(--accent);font-size:12px;word-break:break-all}
  </style>
</head>
<body>
  <main class="shell"><div class="brand"><span class="mark">IH</span><span>Image Host</span></div><section class="card">
    <h1>Share a larger image.</h1>
    <div class="auth" id="auth"><p>Enter your permanent upload code from Discord to unlock uploads.</p><form id="auth-form"><label for="access-code">Upload code</label><input id="access-code" maxlength="6" inputmode="text" autocomplete="one-time-code" placeholder="ABC123" required><button type="submit">Unlock upload page</button></form></div>
    <div id="uploader" hidden><p>Choose an image and uploading starts immediately. Images up to 50 MB are supported.</p><label class="drop" for="image"><span class="drop-icon">↥</span><span><strong id="file-name">Choose an image</strong><small>PNG, JPG, GIF, WebP, BMP, AVIF, or TIFF</small></span><input id="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,image/avif,image/tiff"></label><div class="limits"><span>1 KB minimum</span><span>1 MB chunks</span><span>50 MB maximum</span></div><div class="meter"><span id="progress"></span></div></div>
    <div class="status" id="status" role="status" aria-live="polite"></div><div class="history" id="history" hidden><h2>Saved on this device</h2><div id="history-list"></div></div>
  </section></main>
  <script>
    const input=document.querySelector("#image"), auth=document.querySelector("#auth"), uploader=document.querySelector("#uploader"), form=document.querySelector("#auth-form"), codeInput=document.querySelector("#access-code"), status=document.querySelector("#status"), progress=document.querySelector("#progress"), history=document.querySelector("#history"), historyList=document.querySelector("#history-list"), api="/api/more-upload", authApi="/api/more-auth", historyKey="image-host-upload-history";
    let session="";
    const readHistory=()=>{try{return JSON.parse(localStorage.getItem(historyKey)||"[]").filter(x=>x&&x.url)}catch{return[]}};
    const escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function renderHistory(){const items=readHistory();history.hidden=!items.length;historyList.innerHTML=items.map(x=>`<a href="${escapeHtml(x.url)}" target="_blank" rel="noopener">${escapeHtml(x.name||x.url)}<br><small>${escapeHtml(x.url)}</small></a>`).join("")}
    function saveLink(item){try{localStorage.setItem(historyKey,JSON.stringify([item,...readHistory().filter(x=>x.url!==item.url)]))}catch{}renderHistory()}
    renderHistory();
    form.addEventListener("submit",async event=>{event.preventDefault();status.className="";status.textContent="Checking code…";try{const response=await fetch(authApi,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:codeInput.value})});const result=await response.json();if(!response.ok)throw new Error(result.error||"Invalid code.");session=result.session;auth.hidden=true;uploader.hidden=false;status.textContent="Unlocked. Choose an image to upload.";codeInput.value=""}catch(error){status.className="error";status.textContent=error.message}});
    input.addEventListener("change",()=>{const file=input.files[0];if(file){document.querySelector("#file-name").textContent=`${file.name} · ${(file.size/1048576).toFixed(1)} MB`;startUpload(file)}});
    function sendChunk(index,file,total){const size=1048576,start=index*size,end=Math.min(file.size,start+size),data=new FormData();data.append("chunk",file.slice(start,end),file.name);data.append("session",session);data.append("index",String(index));data.append("total",String(total));data.append("filename",file.name);data.append("contentType",file.type);return new Promise((resolve,reject)=>{const request=new XMLHttpRequest();request.open("POST",`${api}?chunk=${index}`);request.timeout=120000;request.upload.onprogress=e=>{if(e.lengthComputable)progress.style.width=`${Math.round(((start+e.loaded)/file.size)*100)}%`};request.onload=()=>{let result={};try{result=JSON.parse(request.responseText||"{}")}catch{}if(request.status>=200&&request.status<300)resolve(result);else reject(new Error(result.error||`Upload failed (${request.status}).`))};request.onerror=()=>reject(new Error("Could not reach the upload service. Please try again."));request.ontimeout=()=>reject(new Error("The upload took too long. Please try again."));request.send(data)})}
    async function startUpload(file){if(!session)return;if(file.size<1024||file.size>50*1048576||!/^image\/(png|jpeg|gif|webp|bmp|avif|tiff)$/i.test(file.type)){status.className="error";status.textContent="Choose a supported image between 1 KB and 50 MB.";return}input.disabled=true;status.className="";status.textContent="Uploading image…";progress.style.width="2%";try{const total=Math.ceil(file.size/1048576),jobs=[];for(let i=0;i<total-1;i++)jobs.push(sendChunk(i,file,total));if(jobs.length)await Promise.all(jobs);const result=await sendChunk(total-1,file,total),url=new URL(result.url,location.origin).href;saveLink({url,name:result.name||file.name,size:result.size||file.size,savedAt:new Date().toISOString()});progress.style.width="100%";status.className="success";status.innerHTML=`Uploaded and saved.<br><a class="result" href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>`;input.disabled=false}catch(error){status.className="error";status.textContent=error.message;input.disabled=false}}
  </script>
</body>
</html>
